# tack pins. edit by hand or with tack add / rm / alias
# nix reads pins.lock.json; this file drives tack update

# shorturl schemes. scheme:rest expands rest into {path}
[shorturls]
nixpkgs = "https://channels.nixos.org/{path}/nixexprs.tar.zst"
"git+ssh" = "git+ssh://git@github.com/{path}"

# all_follow: input name -> top-level pin it follows wherever it appears
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = "nixpkgs"

[tack]
recomposable = true

# [inputs.<name>] fields
#   url             required, shorturl ok; ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only: tarball or file
[inputs.nixpkgs]
url = "nixpkgs:nixos-unstable"

[inputs.hjem]
url = "github:feel-co/hjem"

[inputs.disko]
url = "github:nix-community/disko/latest"

[inputs.preservation]
url = "github:nix-community/preservation"

[inputs.sops-nix]
url = "github:Mic92/sops-nix"

[inputs.nix-secrets]
url = "git+https://github.com/MisterKartoffel/nix-secrets"

[inputs.basix]
url = "github:NotAShelf/Basix"

[inputs.zen-browser]
url = "github:youwen5/zen-browser-flake"

# Waiting on:
# https://github.com/NixOS/nixpkgs/pull/551635
[inputs.ortie]
url = "github:pimalaya/ortie"

# Waiting on:
# Still no PR to Nixpkgs
[inputs.myx]
url = "github:HaseebKhalid1507/Myx"
