---
name: "Formatter"

on:
  workflow_call:

permissions: {}

jobs:
  formatter:
    name: "Check formatting"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.2
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Run formatter"
      run: nix fmt -- --ci
