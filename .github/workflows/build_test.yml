---
name: "Build"

on:
  workflow_call:
    secrets:
      BWS_ACCESS_TOKEN:
        required: true

permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - system: x86_64-linux
          runner: ubuntu-latest
        - system: aarch64-linux
          runner: ubuntu-24.04-arm

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Build"
      env:
        SYSTEM: ${{ matrix.system }}
      run: >
        nix run nixpkgs#nix-fast-build --
        --skip-cached --systems "${SYSTEM}"
        --cachix-cache misterkartoffel
        --push-build-closure
        --flake .#hydraJobs
