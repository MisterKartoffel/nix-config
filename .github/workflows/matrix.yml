---
name: "Matrix"

on:
  workflow_call:
    inputs:
      eval:
        description: "Outputs to evaluate"
        required: false
        type: string
        default: '["hosts", "packages", "shells"]'
    secrets:
      BWS_ACCESS_TOKEN:
        required: true
    outputs:
      hosts:
        value: ${{ jobs.eval.outputs.hosts }}
      packages:
        value: ${{ jobs.eval.outputs.packages }}
      shells:
        value: ${{ jobs.eval.outputs.shells }}

permissions: {}

jobs:
  eval:
    name: "Generate builder matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        set_env: false
        secrets: |
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        filter-drv-closures: true
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Discover matrices"
      id: discover
      env:
        EVAL: ${{ inputs.eval }}
      working-directory: ./ci
      run: |
        for OUTPUT in $(jq --raw-output ".[]" <<< "${EVAL}"); do
          echo "::group::Evaluating ${OUTPUT}"
          VALUE=$(nix eval --json --file matrix.nix --apply "x: x.${OUTPUT}")

          echo "Evaluated JSON for ${OUTPUT}:"
          jq "." <<< "${VALUE}"

          jq --raw-output ".[].drvPath" <<< "${VALUE}" | xargs "${HESTIA_BIN}" hook --socket "${HESTIA_SOCKET}"
          echo "${OUTPUT}=${VALUE}" >> "${GITHUB_OUTPUT}"
          echo "::endgroup::"
        done

    outputs:
      hosts: ${{ steps.discover.outputs.hosts }}
      packages: ${{ steps.discover.outputs.packages }}
      shells: ${{ steps.discover.outputs.shells }}
