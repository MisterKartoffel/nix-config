---
name: "Matrix"

on:
  workflow_call:
    secrets:
      BWS_ACCESS_TOKEN:
        required: true
    outputs:
      hosts:
        value: ${{ jobs.eval.outputs.hosts }}

permissions: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read

    outputs:
      hosts: ${{ steps.generate.outputs.hosts }}

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        set_env: false
        secrets: |
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        filter-drv-closures: true
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Generate matrix"
      id: generate
      working-directory: ./ci
      run: |
        MATRIX=$(nix eval --json --file matrix.nix)
        jq -r ".[].drvPath" <<< "${MATRIX}" | xargs "${HESTIA_BIN}" hook --socket "${HESTIA_SOCKET}"
        echo "hosts=${MATRIX}" >> "${GITHUB_OUTPUT}"
