---
name: "Matrix"

on:
  workflow_call:
    secrets:
      BWS_ACCESS_TOKEN:
        required: true
    outputs:
      nixos:
        value: ${{ jobs.eval.outputs.nixos }}
      darwin:
        value: ${{ jobs.eval.outputs.darwin }}
      packages:
        value: ${{ jobs.eval.outputs.packages }}
      devshells:
        value: ${{ jobs.eval.outputs.devshells }}

permissions: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read

    outputs:
      nixos: ${{ steps.discover.outputs.nixos }}
      darwin: ${{ steps.discover.outputs.darwin }}
      packages: ${{ steps.discover.outputs.packages }}
      devshells: ${{ steps.discover.outputs.devshells }}

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        set_env: false
        secrets: |
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        filter-drv-closures: true
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Discover matrices"
      id: discover
      env:
        INVENTORY_VERBOSE: "1"
      run: nix run .#inventory

    - name: "Upload input closures"
      env:
        MATRIX: ${{ toJSON(steps.discover.outputs) }}
      run: >
        jq -r ".[] | fromjson? // [] | .[].drvPath" <<< "${MATRIX}"
        | xargs "${HESTIA_BIN}" hook --socket "${HESTIA_SOCKET}"
