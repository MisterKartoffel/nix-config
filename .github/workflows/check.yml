---
name: "Check"

on:
  workflow_call:
    secrets:
      BWS_ACCESS_TOKEN:
        required: true

permissions: {}

jobs:
  check:
    name: "Check flake"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: read

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        set_env: false
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      continue-on-error: true
      with:
        filter-drv-closures: true
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@v17
      continue-on-error: true
      with:
        name: misterkartoffel
        authToken: ${{ steps.secrets.outputs.CACHIX_AUTH_TOKEN }}

    - name: "Run flake check"
      run: nix flake check --all-systems
