---
name: "Build Outputs"
run-name: "${{ github.workflow }}: ${{ github.ref_name }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  push:
    branches:
    - main
    paths-ignore:
    - ".github/**"
    - "ci/**"
    - "LICENSE"
    - "README.md"
    - "TODO.txt"
  pull_request:
    branches:
    - main
    paths-ignore:
    - ".github/**"
    - "ci/**"
    - "LICENSE"
    - "README.md"
    - "TODO.txt"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatter:
    name: "Formatter"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.2
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Run formatter"
      run: nix fmt -- --ci

  check:
    name: "Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.2
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Run flake check"
      run: nix flake check --all-systems

  matrix:
    name: "Discover hosts"
    uses: $/.github/workflows/matrix.yml
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  hosts:
    name: "Hosts"
    if: needs.matrix.outputs.hosts != '[]'
    uses: $/.github/workflows/hosts.yml
    needs:
    - check
    - matrix
    permissions:
      actions: read
    with:
      matrix: ${{ needs.matrix.outputs.hosts }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  outputs:
    name: "Outputs"
    uses: $/.github/workflows/outputs.yml
    needs: check
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
