---
name: "Build Outputs"
run-name: "${{ github.workflow }}: ${{ github.ref_name }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  push:
    branches:
    - main
    paths-ignore:
    - ".github/**"
    - "ci/**"
    - "LICENSE"
    - "README.md"
    - "TODO.txt"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatter:
    uses: $/.github/workflows/formatter.yml
    permissions: {}

  check:
    uses: $/.github/workflows/check.yml
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  matrix:
    uses: $/.github/workflows/matrix.yml
    with:
      eval: '["shells", "packages", "hosts"]'
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  hosts:
    uses: $/.github/workflows/build.yml
    needs:
    - check
    - matrix
    with:
      matrix: ${{ needs.matrix.outputs.hosts }}
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  packages:
    uses: $/.github/workflows/build.yml
    needs:
    - check
    - matrix
    with:
      matrix: ${{ needs.matrix.outputs.packages }}
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  shells:
    uses: $/.github/workflows/build.yml
    needs:
    - check
    - matrix
    with:
      matrix: ${{ needs.matrix.outputs.shells }}
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
