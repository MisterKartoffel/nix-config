---
name: "Build Outputs"
run-name: "${{ github.workflow }}: ${{ github.ref_name }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  pull_request:
    paths-ignore:
    - ".github/workflows/**"
    - "ci/**"
  push:
    branches:
    - main
    paths-ignore:
    - ".github/workflows/**"
    - "ci/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatter:
    uses: $/.github/workflows/formatter.yml
    permissions:
      actions: read
    secrets: inherit

  check:
    uses: $/.github/workflows/check.yml
    permissions:
      actions: read
    secrets: inherit

  matrix:
    uses: $/.github/workflows/matrix.yml
    if: github.event_name != 'pull_request'
    permissions:
      pull-requests: read
    secrets: inherit

  shells:
    uses: $/.github/workflows/build.yml
    needs:
    - check
    - matrix
    with:
      target: "shell"
      matrix: ${{ needs.matrix.outputs.shells }}
    permissions:
      actions: read
    secrets: inherit

  packages:
    uses: $/.github/workflows/build.yml
    needs:
    - check
    - matrix
    with:
      target: "package"
      matrix: ${{ needs.matrix.outputs.packages }}
    permissions:
      actions: read
    secrets: inherit

  hosts:
    uses: $/.github/workflows/build.yml
    needs:
    - check
    - matrix
    with:
      target: "host"
      matrix: ${{ needs.matrix.outputs.hosts }}
    permissions:
      actions: read
    secrets: inherit
