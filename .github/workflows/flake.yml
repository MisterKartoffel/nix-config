---
name: "Build Outputs"
run-name: "${{ github.workflow }}: ${{ github.ref_name }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  merge_group:
  workflow_dispatch:

env:
  DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  checks:
    name: "Required checks"
    uses: $/.github/workflows/checks.yml
    permissions:
      pull-requests: read

  eval:
    name: "Evaluate required rebuilds"
    if: needs.checks.outputs.flake == 'true'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      hosts: >-
        ${{ env.DISPATCH == 'true' && 'true' ||
        steps.filter.outputs.hosts }}
      matrix: ${{ steps.generate.outputs.matrix }}

    steps:
    - name: "Checkout repository"
      if: env.DISPATCH != 'true'
      uses: actions/checkout@v7.0.1

    - name: "Filter paths"
      if: env.DISPATCH != 'true'
      id: filter
      uses: dorny/paths-filter@v4.0.3
      with:
        filters: |
          rebuild: &rebuild
          - '.tack/**'
          - 'overlays/**'
          - 'flake.nix'

          packages: &packages
          - *rebuild
          - 'pkgs/**'

          devShells:
          - *rebuild
          - 'shell.nix'

          hosts:
          - *rebuild
          - *packages
          - 'hosts/**'
          - 'modules/**'
          - 'users/**'

    - name: "Derivation matrix"
      id: generate
      env:
        FILTERS: ${{ toJSON(steps.filter.outputs) }}
      run: |
        MATRIX=$(jq --null-input --compact-output \
          --argjson filters "${FILTERS}" --argjson dispatch "${DISPATCH}" '
          [ ("x86_64-linux", "aarch64-linux") as $system
          | ("devShells", "packages") as $output
          | select($dispatch or $filters[$output] == "true")
          | {$output, $system} ]
        ')

        echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  matrix:
    name: "Discover hosts"
    if: needs.eval.outputs.hosts == 'true'
    needs:
    - checks
    - eval
    uses: $/.github/workflows/matrix.yml
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  hosts:
    name: "${{ matrix.name }} (${{ matrix.system }})"
    if: needs.matrix.outputs.hosts != '[]'
    needs:
    - checks
    - matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.hosts) }}

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > NIVOLOGY_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ env.NIVOLOGY_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@v17
      continue-on-error: true
      with:
        name: misterkartoffel
        authToken: ${{ env.CACHIX_AUTH_TOKEN }}

    - name: "Prefetch derivation closure"
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: ${HESTIA_BIN} prefetch "${DRV_PATH}"

    - name: "Build"
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: >
        nix build "${DRV_PATH}^*"
        --no-link --print-build-logs

  derivations:
    name: "${{ matrix.output }} (${{ matrix.system }})"
    if: needs.eval.outputs.matrix != '[]'
    needs:
    - checks
    - eval
    runs-on: >-
      ${{ matrix.system == 'x86_64-linux' && 'ubuntu-latest'
      || matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' }}
    timeout-minutes: 30

    permissions:
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.eval.outputs.matrix) }}

    steps:
    - name: "Get secrets"
      if: github.event_name != 'pull_request'
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        read-only: ${{ github.event_name == 'pull_request' }}
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Build"
      run: >
        nix run nixpkgs#nix-fast-build --
        --skip-cached --push-build-closure
        --cachix-cache misterkartoffel
        --flake .#${{ matrix.output }}.${{ matrix.system }}
