---
name: "Update Inputs"
run-name: "${{ github.workflow }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  schedule:
  - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: tack-update
  cancel-in-progress: false

jobs:
  update:
    name: "Update tack pins"
    runs-on: ubuntu-latest
    env:
      TACK_NIX_CONF_TOKENS: 1

    outputs:
      summary: ${{ steps.summary.outputs.summary }}

    steps:
    - parallel:
      - name: "Checkout tack directory"
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .tack

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Get update summary"
      id: summary
      run: |
        {
          echo "SUMMARY<<EOF"
          nix run nixpkgs#tack -- look --verbose
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: "Run tack update"
      run: nix run nixpkgs#tack -- update

    - name: "Upload changes"
      uses: actions/upload-artifact@v7
      with:
        name: tack
        path: .tack
        include-hidden-files: true

  matrix:
    uses: $/.github/workflows/matrix.yml
    needs: update
    with:
      eval: "[\"hosts\"]"
    permissions:
      actions: read
      pull-requests: read
    secrets: inherit

  diffs:
    name: "Generate diffs"
    needs: matrix
    runs-on: ${{ matrix.runner }}

    permissions:
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.hosts) }}

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        filter-drv-closures: true
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@v17
      continue-on-error: true
      with:
        name: misterkartoffel

    - name: "Prefetch derivation closure"
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: ${HESTIA_BIN} prefetch "${DRV_PATH}"

    - name: "Build old closure"
      id: old
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: >
        "closure=$(nix build
        "${DRV_PATH}^*"
        --no-link
        --print-out-paths)"
        >> "${GITHUB_OUTPUT}"

    - name: "Download changes"
      uses: actions/download-artifact@v8.0.1
      with:
        name: tack
        path: .tack

    - name: "Build new closure"
      id: new
      env:
        HOSTNAME: ${{ matrix.hostname }}
      run: >
        "closure=$(nix build
        ".#nixosConfigurations.${HOSTNAME}.config.system.build.toplevel"
        --no-link
        --print-out-paths)"
        >> "${GITHUB_OUTPUT}"

    - name: "Generate diff"
      id: generate
      env:
        OLD_CLOSURE: ${{ steps.old.outputs.closure }}
        NEW_CLOSURE: ${{ steps.new.outputs.closure }}
      working-directory: ./ci
      run: >
        nix run nixpkgs#dix -- --output json
        "${OLD_CLOSURE}" "${NEW_CLOSURE}"
        > diff.json

    - name: "Parse JSON"
      id: parse
      env:
        HOSTNAME: ${{ matrix.hostname }}
      working-directory: ./ci
      run: >
        nix eval --raw --file diff.nix
        > "${HOSTNAME}.svg"

    - name: "Upload diff JSON"
      if: steps.generate.outcome == 'failure' || steps.parse.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: failure-${{ matrix.hostname }}
        path: ci/diff.json

    - name: "Upload diff SVG"
      if: steps.parse.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: diff-${{ matrix.hostname }}
        path: ci/${{ matrix.hostname }}.svg

  pages:
    name: "Publish diffs"
    if: ${{ !cancelled() }}
    needs: diffs
    runs-on: ubuntu-latest

    permissions:
      actions: read
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - name: "Download diffs"
      uses: actions/download-artifact@v8.0.1
      with:
        pattern: diff-*
        path: _site/diffs/${{ github.run_id }}
        merge-multiple: true

    - name: "Set up Pages"
      uses: actions/configure-pages@v6.0.0

    - name: "Upload Pages artifact"
      uses: actions/upload-pages-artifact@v5.0.0

    - name: "Deploy to Pages"
      id: deploy
      uses: actions/deploy-pages@v5.0.1

  pull-request:
    name: "Create pull request"
    if: ${{ !cancelled() && needs.pages.result == 'success' }}
    needs:
    - update
    - matrix
    - pages
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: "Checkout repository"
      uses: actions/checkout@v7.0.1

    - name: "Download changes"
      uses: actions/download-artifact@v8.0.1
      with:
        name: tack
        path: .tack

    - name: "Create pull request body"
      id: body
      env:
        RUN_ID: ${{ github.run_id }}
        SUMMARY: ${{ needs.update.outputs.summary }}
        PAGE_URL: ${{ needs.pages.outputs.page_url }}
        HOSTS: ${{ needs.matrix.outputs.hosts }}
      run: |
        {
          echo "TEXT<<EOF"
          echo "## tack update summary:"
          echo
          echo '```text'
          echo "${SUMMARY}"
          echo '```'
          echo
          echo "## Closure diffs"

          while read -r HOSTNAME; do
            echo "<details>"
            echo "<summary>${HOSTNAME}</summary>"
            echo
            echo "![${HOSTNAME} closure diff](${PAGE_URL}diffs/${RUN_ID}/${HOSTNAME}.svg)"
            echo
            echo "</details>"
            echo
          done < <(jq -r '.[].hostname' <<< "${HOSTS}")

          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: "Create pull request"
      id: pull-request
      uses: peter-evans/create-pull-request@v8
      with:
        branch: tack/update-inputs
        delete-branch: true
        sign-commits: true
        assignees: ${{ github.repository_owner }}
        commit-message: "tack: update inputs"
        title: "tack: update inputs"
        body: ${{ steps.body.outputs.text }}
        labels: |
          dependencies
          CI/CD
          tack
