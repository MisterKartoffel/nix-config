---
name: "Update Inputs"
run-name: "${{ github.workflow }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  schedule:
  - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: tack-update
  cancel-in-progress: false

jobs:
  update:
    name: "Update inputs"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TACK_NIX_CONF_TOKENS: 1

    outputs:
      summary: ${{ steps.summary.outputs.summary }}

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        set_env: false
        secrets: |
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout tack directory"
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .tack

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Get update summary"
      id: summary
      run: |
        {
          echo "SUMMARY<<EOF"
          nix run nixpkgs#tack -- look --verbose
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: "Update pins and resolver"
      run: |
        nix run nixpkgs#tack -- update
        nix run nixpkgs#tack -- init --resolver

    - name: "Upload changes"
      uses: actions/upload-artifact@v7
      with:
        name: tack
        path: .tack
        include-hidden-files: true

  matrix:
    name: "Discover hosts"
    uses: $/.github/workflows/matrix.yml
    needs: update
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  diffs:
    name: "Diff ${{ matrix.name }}"
    uses: $/.github/workflows/diff.yml
    needs: matrix
    permissions:
      actions: read
    with:
      name: ${{ matrix.name }}
      drvPath: ${{ matrix.drvPath }}
      runner: ${{ matrix.runner }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.hosts) }}

  pages:
    name: "Publish diffs"
    if: false
    needs: diffs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: read
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - name: "Download diffs"
      uses: actions/download-artifact@v8.0.2
      with:
        pattern: diff-*
        path: _site/diffs/${{ github.run_id }}
        merge-multiple: true

    - name: "Set up Pages"
      uses: actions/configure-pages@v6.0.0

    - name: "Upload Pages artifact"
      uses: actions/upload-pages-artifact@v5.0.0

    - name: "Deploy to Pages"
      id: deploy
      uses: actions/deploy-pages@v5.0.1

  pull-request:
    name: "Create pull request"
    if: ${{ !cancelled() && needs.pages.result == 'success' }}
    needs:
    - update
    - matrix
    - pages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: "Checkout repository"
      uses: actions/checkout@v7.0.1

    - name: "Download changes"
      uses: actions/download-artifact@v8.0.2
      with:
        name: tack
        path: .tack

    - name: "Create pull request body"
      id: body
      env:
        RUN_ID: ${{ github.run_id }}
        SUMMARY: ${{ needs.update.outputs.summary }}
        PAGE_URL: ${{ needs.pages.outputs.page_url }}
        HOSTS: ${{ needs.matrix.outputs.hosts }}
      run: |
        {
          echo "TEXT<<EOF"
          echo "## Input update summary"
          echo '```text'
          echo "${SUMMARY}"
          echo '```'
          echo "## Closure diffs"

          while read -r NAME; do
            echo "<details>"
            echo "<summary>${NAME}</summary>"
            echo "![${NAME} closure diff](${PAGE_URL}diffs/${RUN_ID}/${NAME}.svg)"
            echo "</details>"
          done < <(jq -r '.[].name' <<< "${HOSTS}")

          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: "Create pull request"
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        branch: tack/update-inputs
        delete-branch: true
        sign-commits: true
        signoff: true
        assignees: ${{ github.repository_owner }}
        commit-message: "tack: update inputs"
        title: "tack: update inputs"
        body: ${{ steps.body.outputs.text }}
        labels: |
          dependencies
          CI/CD
          tack
