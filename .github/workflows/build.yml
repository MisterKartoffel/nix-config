---
name: "Build"

on:
  workflow_call:
    inputs:
      validate:
        description: "Run in validation mode"
        type: boolean
      target:
        description: "Derivation kind"
        required: false
        default: "shell"
        type: string
      matrix:
        description: "Build matrix"
        required: false
        default: "[{\"installable\": \"default\", \"runner\": \"ubuntu-latest\", \"system\": \"x86_64-linux\"}]"
        type: string

jobs:
  build:
    name: "${{ matrix.installable }} (${{ matrix.system }})"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - parallel:
      - name: "Setup Cachix"
        if: ${{ !inputs.validate }}
        uses: cachix/cachix-action@v17
        continue-on-error: true
        with:
          name: misterkartoffel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: "Setup Hestia"
        if: ${{ !inputs.validate }}
        uses: Mic92/hestia@v3.0.1
        continue-on-error: true
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: >
            cache.nixos.org-1
            misterkartoffel.cachix.org-1

    - name: "Build ${{ inputs.target }}"
      env:
        TARGET: ${{ inputs.target }}
      run: |
        case "${TARGET}" in
          host)
            nix build \
            ".#${{ matrix.platform }}Configurations.${{ matrix.installable }}.config.system.build.toplevel" \
            --print-build-logs
            ;;

          package)
            nix build \
            ".#packages.${{ matrix.system }}.${{ matrix.installable }}" \
            --print-build-logs
            ;;

          shell)
            nix build \
            ".#devShells.${{ matrix.system }}.${{ matrix.installable }}" \
            --print-build-logs
            ;;
        esac
