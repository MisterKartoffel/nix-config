---
name: "Build"
run-name: "${{ github.workflow }}: ${{ github.ref_name }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  push:
    paths-ignore:
    - ".github/**"
    - "ci/**"
    - "LICENSE"
    - "README.md"
    - "TODO.txt"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  matrix:
    name: "Discover hosts"
    uses: $/.github/workflows/matrix.yml
    permissions:
      actions: read
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  hosts:
    name: "${{ matrix.name }} (${{ matrix.system }})"
    if: needs.matrix.outputs.hosts != '[]'
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.hosts) }}

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          github_access_token: ${{ env.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@v17
      continue-on-error: true
      with:
        name: misterkartoffel
        authToken: ${{ env.CACHIX_AUTH_TOKEN }}

    - name: "Prefetch derivation closure"
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: ${HESTIA_BIN} prefetch "${DRV_PATH}"

    - name: "Build"
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: >
        nix build "${DRV_PATH}^*"
        --no-link --print-build-logs

  derivations:
    name: "${{ matrix.output }} (${{ matrix.system }})"
    runs-on: >
      ${{ matrix.system == 'x86_64-linux' && 'ubuntu-latest'
      || matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' }}
    timeout-minutes: 30

    permissions:
      actions: read

    strategy:
      fail-fast: false
      matrix:
        system:
        - x86_64-linux
        - aarch64-linux
        output:
        - packages
        - devShells

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Build"
      run: >
        nix run nixpkgs#nix-fast-build --
        --skip-cached --push-build-closure
        --cachix-cache misterkartoffel
        --flake .#${{ matrix.output }}.${{ matrix.system }}
