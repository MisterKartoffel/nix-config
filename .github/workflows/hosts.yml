---
name: "Hosts"

on:
  workflow_call:
    inputs:
      matrix:
        description: "Build matrix"
        required: true
        type: string
    secrets:
      BWS_ACCESS_TOKEN:
        required: true

permissions: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.system }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        set_env: false
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@v17
      continue-on-error: true
      with:
        name: misterkartoffel
        authToken: ${{ steps.secrets.outputs.CACHIX_AUTH_TOKEN }}

    - name: "Prefetch derivation closure"
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: ${HESTIA_BIN} prefetch "${DRV_PATH}"

    - name: "Build"
      env:
        DRV_PATH: ${{ matrix.drvPath }}
      run: >
        nix build "${DRV_PATH}^*"
        --no-link --print-build-logs
