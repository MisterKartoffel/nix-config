---
name: "Validate Workflows"
run-name: "${{ github.workflow }}: ${{ github.ref_name }} (#${{ github.run_number }}-${{ github.run_attempt }})"

on:
  push:
    paths:
    - "!.github/assets/**"
    - ".github/**"
    - "ci/**"
  pull_request:
    paths:
    - "!.github/assets/**"
    - ".github/**"
    - "ci/**"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  actionlint:
    name: "Lint actions"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: "Checkout .github"
      uses: actions/checkout@v7.0.1
      with:
        sparse-checkout: |
          .github

    - name: "Actionlint"
      uses: kjanat/actionlint@v1.17.0

  formatter:
    name: "Treefmt CI"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - parallel:
      - name: "Checkout inputs and CI"
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .tack
            ci

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Run formatter on CI"
      working-directory: ./ci
      run: nix fmt -- --ci .
