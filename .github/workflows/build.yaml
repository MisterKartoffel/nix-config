name: "Build and cache NixOS Configurations"

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yaml"
      - ".tack/pins.lock.json"
      - "hosts/**/facter.json"
      - "**/*.nix"
      - "**/*.lua"

permissions:
  contents: read

jobs:
  check-flake:
    name: Check flake
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GH_PAT_SECRETS_RO }}
        extra_nix_config: |
          extra-substituters = https://misterkartoffel.cachix.org/
          extra-trusted-public-keys = misterkartoffel.cachix.org-1:hSj2uihi9MyLtzjS56ALG9tIIRlQXZfVnPeIIFGG/E4=

    - name: Check flake
      run: nix flake check

  discover-hosts:
    name: "Discover NixOS Configurations"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GH_PAT_SECRETS_RO }}
        extra_nix_config: |
          extra-substituters = https://misterkartoffel.cachix.org/
          extra-trusted-public-keys = misterkartoffel.cachix.org-1:hSj2uihi9MyLtzjS56ALG9tIIRlQXZfVnPeIIFGG/E4=

    - name: Discover hosts
      id: discover
      run: |
        hosts=$(nix eval --json ".#nixosConfigurations" --apply builtins.attrNames)
        echo "hosts=$hosts" >> $GITHUB_OUTPUT

    outputs:
      hosts: ${{ steps.discover.outputs.hosts }}


  build-nix-configurations:
    name: "Build and cache ${{ matrix.host }}"
    needs:
      - check-flake
      - discover-hosts
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.discover-hosts.outputs.hosts) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: '${{ secrets.GH_PAT_SECRETS_RO }}'

    - name: Configure Cachix
      uses: cachix/cachix-action@v17
      with:
        name: misterkartoffel
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Build NixOS Configuration
      run: nix build --print-build-logs ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
