name: Build NixOS Configurations

on:
  push:
    paths: &workflow-paths
    - ".github/workflows/build.yaml"
    - ".github/actions/setup-nix/**"
    - ".tack/pins.lock.json"
    - "hosts/**/facter.json"
    - "**/*.nix"
    - "**/*.lua"
  pull_request:
    paths: *workflow-paths

concurrency:
  group: nixos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  treefmt:
    name: Check formatting
    runs-on: ubuntu-slim
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Run formatter
      run: |
        if ! nix fmt -- --ci; then
          echo "Incorrect formatting, run 'nix fmt' at the root of the repository."
          exit 1
        fi

  check:
    name: Check flake
    runs-on: ubuntu-slim
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - run: nix flake check --all-systems

  matrix:
    name: Create builder matrix
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Discover matrix
      id: discover
      run: |
        matrix=$(nix eval --impure --json --file ./ci/matrix.nix)
        echo "matrix=$matrix" >> "${GITHUB_OUTPUT}"

  shells:
    name: Build ${{ matrix.system }} devShell
    needs:
    - matrix
    - check
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
      with:
        use_cachix: ${{ github.event_name == 'push' }}
        cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Build devShell
      run: nix build ".#devShells.${{ matrix.system }}.default" --print-build-logs

  systems:
    name: Build ${{ matrix.hostname }}
    needs:
    - matrix
    - check
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
      with:
        github_pat: ${{ secrets.GH_PAT_SECRETS_RO }}
        use_cachix: ${{ github.event_name == 'push' }}
        cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Build NixOS Configuration
      run: nix build ".#nixosConfigurations.${{ matrix.hostname }}.config.system.build.toplevel" --print-build-logs
