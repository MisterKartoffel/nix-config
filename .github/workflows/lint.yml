---
name: "Lint"

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatter:
    name: "Formatter"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Run formatter"
      run: nix fmt -- --ci

  check:
    name: "Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Run flake check"
      run: nix flake check --all-systems
