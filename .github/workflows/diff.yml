---
name: "Diff"

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      drvPath:
        required: true
        type: string
      runner:
        required: true
        type: string
    secrets:
      BWS_ACCESS_TOKEN:
        required: true

permissions: {}

jobs:
  old:
    name: "Build old closure"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    permissions:
      actions: read

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        set_env: false
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
          extra_nix_config: cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@v17
      with:
        name: misterkartoffel
        authToken: ${{ steps.secrets.outputs.CACHIX_AUTH_TOKEN }}

    - name: "Prefetch derivation closure"
      env:
        DRV_PATH: ${{ inputs.drvPath }}
      run: ${HESTIA_BIN} prefetch "${DRV_PATH}"

    - name: "Build closure"
      id: build
      env:
        DRV_PATH: ${{ inputs.drvPath }}
      run: >
        CLOSURE=$(nix build
        "${DRV_PATH}^*"
        --no-link --print-out-paths)

        echo "closure=${CLOSURE}" >> "${GITHUB_OUTPUT}"

    - name: "Generate snapshot"
      env:
        CLOSURE: ${{ steps.build.outputs.closure }}
      run: nix run nixpkgs#dix -- snapshot "${CLOSURE}" > "old.json"

    - name: "Upload snapshot"
      uses: actions/upload-artifact@v7
      with:
        name: snapshot-${{ inputs.name }}-old
        path: old.json

  new:
    name: "Build new closure"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    permissions:
      actions: read

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        set_env: false
        secrets: |
          ad184127-0d3f-4115-8801-b4e501565b66 > CACHIX_AUTH_TOKEN
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
          extra_nix_config: cores = 0

    - name: "Set up Hestia"
      uses: Mic92/hestia@v3.1.0
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: >
          cache.nixos.org-1
          misterkartoffel.cachix.org-1

    - name: "Set up Cachix"
      uses: cachix/cachix-action@v17
      with:
        name: misterkartoffel
        authToken: ${{ steps.secrets.outputs.CACHIX_AUTH_TOKEN }}

    - name: "Download changes"
      uses: actions/download-artifact@v8.0.2
      with:
        name: tack
        path: .tack

    - name: "Build closure"
      id: build
      env:
        NAME: ${{ inputs.name }}
      run: >
        CLOSURE=$(nix build
        ".#nixosConfigurations.${NAME}.config.system.build.toplevel"
        --no-link --print-out-paths)

        echo "closure=${CLOSURE}" >> "${GITHUB_OUTPUT}"

    - name: "Generate snapshot"
      env:
        CLOSURE: ${{ steps.build.outputs.closure }}
        NAME: ${{ inputs.name }}
      run: nix run nixpkgs#dix -- snapshot "${CLOSURE}" > "new.json"

    - name: "Upload snapshot"
      uses: actions/upload-artifact@v7
      with:
        name: snapshot-${{ inputs.name }}-new
        path: new.json

  diff:
    name: "Generate diff"
    runs-on: ${{ inputs.runner }}
    needs:
    - old
    - new
    timeout-minutes: 10

    steps:
    - name: "Get secrets"
      id: secrets
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
        set_env: false
        secrets: |
          ec6c99d6-ceb6-4954-b487-b4e50156014e > GH_PAT_SECRETS_RO

    - name: "Checkout CI"
      uses: actions/checkout@v7.0.1
      with:
        sparse-checkout: |
          ci

    - name: "Install Nix"
      uses: cachix/install-nix-action@v31.11.3
      with:
        github_access_token: ${{ steps.secrets.outputs.GH_PAT_SECRETS_RO }}
        extra_nix_config: cores = 0

    - name: "Download snapshots"
      uses: actions/download-artifact@v8.0.2
      with:
        pattern: snapshot-${{ inputs.name }}-*
        path: ci
        merge-multiple: true

    - name: "Generate diff"
      id: generate
      working-directory: ./ci
      run: nix run nixpkgs#dix -- diff --output json {old,new}.json > "diff.json"

    - name: "Parse diff"
      id: parse
      working-directory: ./ci
      run: nix eval --raw --file diff.nix > "${{ inputs.name }}.svg"

    - name: "Upload diff JSON"
      if: always() && (steps.generate.outcome == 'failure' || steps.parse.outcome == 'failure')
      uses: actions/upload-artifact@v7
      with:
        name: failure-${{ inputs.name }}
        path: ci/diff.json

    - name: "Upload diff SVG"
      if: steps.parse.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: diff-${{ inputs.name }}
        path: ci/${{ inputs.name }}.svg
