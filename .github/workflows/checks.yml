---
name: "Checks"

on:
  pull_request:
  workflow_call:
    outputs:
      flake:
        value: ${{ jobs.eval.outputs.flake }}

env:
  DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}

permissions: {}

jobs:
  eval:
    name: "Evaluate needed checks"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: read

    outputs:
      flake: >-
        ${{ env.DISPATCH == 'true' && 'true' ||
        steps.filter.outputs.flake }}
      workflows: >-
        ${{ env.DISPATCH == 'true' && 'true' ||
        steps.filter.outputs.workflows }}

    steps:
    - name: "Checkout repository"
      if: env.DISPATCH != 'true'
      uses: actions/checkout@v7.0.1

    - name: "Filter paths"
      if: env.DISPATCH != 'true'
      id: filter
      uses: dorny/paths-filter@v4.0.3
      with:
        filters: |
          flake:
          - '.tack/**'
          - 'overlays/**'
          - 'flake.nix'
          - 'shell.nix'
          - 'ci/treefmt.nix'
          - 'hosts/**'
          - 'modules/**'
          - 'overlays/**'
          - 'pkgs/**'
          - 'templates/**'
          - 'users/**'

          workflows:
          - '!.github/assets'
          - '.github/**'

  formatter:
    name: "Formatter"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Run formatter"
      run: nix fmt -- --ci

  check:
    name: "Flake check"
    needs: eval
    if: needs.eval.outputs.flake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - parallel:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@31.11.3
        with:
          extra_nix_config: |
            keep-going = true
            cores = 0

    - name: "Run flake check"
      run: nix flake check --all-systems

  workflows:
    name: "Actionlint"
    needs: eval
    if: needs.eval.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: "Checkout .github"
      uses: actions/checkout@v7.0.1
      with:
        sparse-checkout: .github

    - name: "Actionlint"
      uses: kjanat/actionlint@v1.17.1

  sentinel:
    name: "Gate required checks"
    needs:
    - check
    - eval
    - formatter
    - workflows
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1

    steps:
    - name: "Check upstream results"
      if: >
        contains(needs.*.result, 'failure') ||
        contains(needs.*.result, 'cancelled')
      run: exit 1
