---
name: "Setup Nix"
description: "Checkout repository, install Nix and configure Cachix"

inputs:
  cachix-auth-token:
    default: ""
  github-token:
    default: ""

runs:
  using: "composite"
  steps:
  - name: "Checkout repository"
    uses: actions/checkout@v7.0.1

  - name: "Install Nix"
    uses: cachix/install-nix-action@v31.11.1
    with:
      github_access_token: ${{ inputs.github-token }}
      extra_nix_config: |
        keep-going = true
        cores = 0

  - name: "Setup Cachix"
    uses: cachix/cachix-action@v17
    continue-on-error: true
    with:
      name: misterkartoffel
      authToken: ${{ inputs.cachix-auth-token }}
